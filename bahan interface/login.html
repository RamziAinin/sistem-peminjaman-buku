<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#9333EA',
                        primaryHover: '#7E22CE',
                        bgAdmin: '#F3F4F6'
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-bgAdmin h-screen flex items-center justify-center p-4 font-sans">

    <div
        class="bg-white max-w-md w-full rounded-2xl shadow-xl overflow-hidden transition-all duration-300 hover:shadow-2xl">

        <!-- Header / Logo Area -->
        <div class="bg-primary p-8 text-center relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-white opacity-10 rounded-full blur-2xl"></div>
            <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-black opacity-10 rounded-full blur-2xl"></div>

            <div class="relative z-10">
                <h2 class="text-3xl font-bold text-white tracking-wide">Admin Portal</h2>
                <p class="mt-2 text-sm text-gray-200">Masuk untuk mengelola sistem aplikasi</p>
            </div>
        </div>

        <!-- Form Area -->
        <div class="p-8">
            <!-- Form langsung diarahkan ke dashboard.html -->
            <form action="dashboardlogin.html" method="GET" class="space-y-6">

                <!-- Email Field -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Admin</label>
                    <div class="relative">
                        <input type="email" id="email" name="email" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200 outline-none text-gray-800 bg-gray-50 focus:bg-white"
                            placeholder="admin@perpuspekalongan.go.id">
                    </div>
                </div>

                <!-- Password Field -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <div class="relative">
                        <input type="password" id="password" name="password" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200 outline-none text-gray-800 bg-gray-50 focus:bg-white"
                            placeholder="••••••••">
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit"
                    class="w-full bg-primary hover:bg-primaryHover text-white font-semibold py-3 px-4 rounded-lg transition-colors duration-300 shadow-md hover:shadow-lg mt-2 flex justify-center items-center gap-2">
                    <span>Masuk ke Dashboard</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z"
                            clip-rule="evenodd" />
                    </svg>
                </button>
            </form>
        </div>

        <!-- Footer / Navigasi Balik -->
        <div class="bg-gray-50 border-t border-gray-100 p-5 text-center">
            <a href="index.html"
                class="text-sm text-gray-500 hover:text-primary transition-colors font-medium flex justify-center items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Kembali ke Halaman User
            </a>
        </div>

    </div>

</body>

</html>
